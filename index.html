<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover">
  <title>sprooto</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="theme-sprooto">
  <main class="app">
    <header class="app-header">
      <h1>sprooto</h1>
      <button
  id="theme-button"
  class="theme-button"
  type="button"
  aria-label="テーマを切り替え"
  title="theme"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M12 3
             C7 3 3 6.8 3 11.5
             C3 16 6.7 20 11.5 20
             H13
             C14.2 20 15 19.2 15 18
             C15 17.2 14.5 16.6 14.5 16
             C14.5 15.2 15.2 14.5 16 14.5
             H17
             C20.3 14.5 21 12.5 21 10.5
             C21 6.3 17.2 3 12 3Z">
    </path>

    <circle cx="8" cy="10" r="1"></circle>
    <circle cx="11" cy="7" r="1"></circle>
    <circle cx="15" cy="8" r="1"></circle>
    <circle cx="16" cy="12" r="1"></circle>
  </svg>
</button>

<select
  id="theme-selector"
  class="theme-selector-hidden"
  aria-label="theme"
  tabindex="-1"
>
  <option value="theme-sprooto">sprooto</option>
  <option value="theme-kasai">kasai</option>
  <option value="theme-ryuichi">ryuichi</option>
  <option value="theme-aya">aya</option>
</select>

<button
  id="undo-button"
  class="icon-button history-button"
  type="button"
  aria-label="元に戻す"
  title="Undo"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M9 8H4V3"></path>
<path d="M4 8c2-3 5-5 9-5 5 0 8 3 8 8s-3 8-8 8h-2"></path>
  </svg>
</button>

<button
  id="redo-button"
  class="icon-button history-button"
  type="button"
  aria-label="やり直す"
  title="Redo"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M15 8h5V3"></path>
<path d="M20 8c-2-3-5-5-9-5-5 0-8 3-8 8s3 8 8 8h2"></path>
  </svg>
</button>

      <button
    id="play-button"
    class="icon-button play-button"
    aria-label="再生・停止"
>
    <svg
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
    >
        <path d="M8 5L19 12L8 19Z"/>
    </svg>
</button>
      <label class="master-control" aria-label="master volume">
  <span class="master-volume-icon" aria-hidden="true">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
      <path d="M15 9a5 5 0 0 1 0 6"></path>
      <path d="M18 6a9 9 0 0 1 0 12"></path>
    </svg>
  </span>

  <input
    id="master-volume"
    type="range"
    min="0"
    max="100"
    value="70"
  >

  <output id="master-volume-value">70</output>
</label>
      <input id="bpm-input" class="bpm-input" type="number" min="40" max="300" value="120" aria-label="BPM">
    </header>

    <section class="sequence-section" aria-label="sequence">
      <div class="sequence-toolbar">
  <div
    id="current-source-display"
    class="current-source-display"
    aria-label="Pattern 01"
  ></div>

  <div class="sequence-toolbar-controls">
    <button
      id="sequence-page-button"
      class="sequence-page-button"
      type="button"
      aria-label="ステップ1～32を表示中。33～64へ切り替え"
    >◧</button>

    <label
      class="compact-value sequence-step-value"
      aria-label="パターンのステップ数"
    >
      <span class="compact-value-label">step</span>

      <input
        id="pattern-length-input"
        class="pattern-length-input compact-value-number"
        type="number"
        min="1"
        max="64"
        step="1"
        value="32"
        aria-label="パターンのステップ数"
      >
    </label>
  </div>
</div>
      <div id="sequence-grid" class="sequence-grid"></div>
    </section>

    <section class="editor-section" aria-label="editor">
      <div id="editor"></div>
    </section>

    <section class="pattern-section" aria-label="pattern manager">
  <div class="pattern-section-header">
    <button
      id="pattern-page-button"
      class="pattern-page-button"
      type="button"
      aria-label="パターン1～12、フィル1～4、セクションA～Hを表示中"
    >
      ◧
    </button>

    <span class="pattern-section-label">
      pattern
    </span>

    <span
      class="fill-column-label"
      aria-label="fill"
    >
      F
    </span>
  </div>

  <div
    id="pattern-grid"
    class="pattern-grid"
  ></div>

  <div class="section-manager">
    <div class="section-manager-header">
      <span>section</span>

      <button
        id="add-section-button"
        class="section-add-button"
        type="button"
        aria-label="セクションを追加"
      >
        ＋
      </button>
    </div>

    <div
      id="section-list"
      class="section-list"
    ></div>
  </div>
</section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
