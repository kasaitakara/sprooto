<!DOCTYPE html>
<html lang="ja" class="theme-sprooto">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#090909"
  >

  <title>mono82</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body>
  <main class="app">

    <header class="app-header">
      <div class="brand-row">
        <div
          id="current-project-name"
          class="current-project-name"
          aria-label="current project"
        >mono82</div>

        <div class="header-actions">
          <button
            id="theme-button"
            class="text-button"
            type="button"
            aria-label="theme"
            title="theme"
          >clr</button>

          <select
            id="theme-selector"
            class="theme-selector-hidden"
            aria-label="theme"
            tabindex="-1"
          >
            <option value="theme-mono82">mono82</option>
            <option value="theme-sprooto">sprooto</option>
            <option value="theme-kasai">kasai</option>
            <option value="theme-mei">mei</option>
            <option value="theme-ryuichi">ryuichi</option>
            <option value="theme-aya">aya</option>
            <option value="theme-tobokegao">tobokegao</option>
            <option value="theme-game">game</option>
          </select>

          <button
            id="project-button"
            class="text-button"
            type="button"
            aria-label="project"
            title="project"
          >prj</button>

          <button
            id="export-button"
            class="text-button"
            type="button"
            aria-label="export"
            title="export"
          >exp</button>
        </div>
      </div>

      <div class="transport-row">
        <div class="transport-left">
          <button
            id="undo-button"
            class="text-button history-button"
            type="button"
            aria-label="undo"
            title="undo"
          ><svg class="mono82-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 5 4 10l5 5M5 10h9c4 0 6 2 6 6v3" />
            </svg></button>

          <button
            id="redo-button"
            class="text-button history-button"
            type="button"
            aria-label="redo"
            title="redo"
          ><svg class="mono82-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 5 5 5-5 5M19 10h-9c-4 0-6 2-6 6v3" />
            </svg></button>
        </div>

        <div class="transport-center">
          <button
            id="play-button"
            class="play-button"
            type="button"
            aria-label="play / stop"
          ><svg class="mono82-icon mono82-icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <polygon points="7,4 20,12 7,20" />
            </svg></button>
        </div>

        <div class="transport-right">
          <label
            class="master-control"
            aria-label="master volume"
          >
            <span class="control-label">vol</span>

            <input
              id="master-volume"
              type="range"
              min="0"
              max="100"
              value="70"
            >

            <output
              id="master-volume-value"
            >70</output>
          </label>

          <label
            class="bpm-control"
            aria-label="bpm"
          >
            <span class="control-label">bpm</span>

            <input
              id="bpm-input"
              type="number"
              min="40"
              max="300"
              value="120"
            >
          </label>
        </div>
      </div>
    </header>


    <section
      class="sequence-section mokton-view mokton-sequence-view"
      aria-label="sequence"
    >
      <div class="section-toolbar">
        <button
          id="current-source-display"
          class="current-source-display mokton-view-button"
          type="button"
          aria-label="back to song"
          title="song"
        >01</button>
      </div>

      <div
        id="sequence-grid"
        class="sequence-grid"
      ></div>
    </section>


    <section
      class="pattern-section mokton-view mokton-pattern-view"
      aria-label="pattern manager"
    >
      <div class="section-toolbar">
        <button
          id="pattern-loop-button"
          class="pattern-loop-button"
          type="button"
          aria-pressed="false"
        >
          <svg class="mono82-icon mono82-icon-loop" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 7h12l-3-3M17 7l-3 3M19 17H7l3 3M7 17l3-3" />
          </svg>
        </button>
      </div>

      <div
        id="pattern-grid"
        class="pattern-grid"
      ></div>
    </section>



    <section
      class="editor-section mokton-view mokton-shared-view"
      aria-label="sound editor"
    >
      <div id="editor"></div>
    </section>


    <!--
      Stage compatibility.
      ui.jsが次の整理段階まで参照する旧IDだけ残す。
      画面には出さない。
    -->
    <div
      class="legacy-stage-hooks"
      hidden
      aria-hidden="true"
    >
      <button
        id="sequence-page-button"
        type="button"
      ></button>

      <input
        id="pattern-length-input"
        type="number"
        value="32"
      >

      <button
        id="pattern-page-button"
        type="button"
      ></button>

      <div id="section-list"></div>
      <div id="song-parts"></div>
      <div id="song-grid"></div>
      <div id="song-master-mix"></div>

      <button
        id="song-page-button"
        type="button"
      ></button>

      <button
        id="sequence-view-toggle"
        type="button"
      ></button>

      <button
        id="song-editor-view-toggle"
        type="button"
      ></button>
    </div>

  </main>

  <script
    type="module"
    src="./js/main.js"
  ></script>
</body>
</html>
